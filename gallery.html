<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Shaankari Kuchipudi Dance and Music Academy</title>
<meta name="description" content="Photographs from the stage, the studio and the academy: performances, costumes and students of Shaankari Kuchipudi Dance and Music Academy.">
<meta name="theme-color" content="#17194F">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">

  <section class="page-head">
    <div class="wrap">
      <h1>Gallery</h1>
      <p>Moments from the stage, the studio and the academy. Select a photo to view it larger.</p>
    </div>
  </section>

  <section class="band" aria-label="Photographs">
    <div class="wrap">
      <div class="masonry">

        <button type="button" data-full="images/img2.jpg">
          <img src="images/img2.jpg" width="2880" height="1920" loading="lazy" decoding="async"
               alt="Seven dancers in Kuchipudi costume on stage in front of a painted forest backdrop">
        </button>

        <button type="button" data-full="images/guru2.jpg">
          <img src="images/guru2.jpg" width="1063" height="1600" loading="lazy" decoding="async"
               alt="A dancer in an orange saree and gold waist belt, holding a golden trident">
        </button>

        <button type="button" data-full="images/banner.jpg">
          <img src="images/banner.jpg" width="3024" height="2012" loading="lazy" decoding="async"
               alt="Students, teachers and guests of the academy posing together on an open-air stage at night">
        </button>

        <button type="button" data-full="images/img1.png">
          <img src="images/img1.png" width="1080" height="1080" loading="lazy" decoding="async"
               alt="A dancer as a many-armed Devi, with other dancers' hands fanned out behind her">
        </button>

        <button type="button" data-full="images/guru5.jpg">
          <img src="images/guru5.jpg" width="856" height="1280" loading="lazy" decoding="async"
               alt="A dancer in an orange saree mid-expression, in front of a golden temple relief">
        </button>

        <button type="button" data-full="images/img3.jpg">
          <img src="images/img3.jpg" width="1542" height="1600" loading="lazy" decoding="async"
               alt="Students in sarees striking hand gestures in the academy studio">
        </button>

        <button type="button" data-full="images/guru1.jpg">
          <img src="images/guru1.jpg" width="1164" height="777" loading="lazy" decoding="async"
               alt="Receiving a degree at a university convocation">
        </button>

        <button type="button" data-full="images/guru3.jpg">
          <img src="images/guru3.jpg" width="853" height="1280" loading="lazy" decoding="async"
               alt="A dancer in an orange costume turning with a playful expression on a decorated stage">
        </button>

        <button type="button" data-full="images/guru6.jpg">
          <img src="images/guru6.jpg" width="1600" height="1071" loading="lazy" decoding="async"
               alt="A performer in an orange turban and rudraksha beads, glancing to the side">
        </button>

        <button type="button" data-full="images/guru4.jpg">
          <img src="images/guru4.jpg" width="1071" height="1600" loading="lazy" decoding="async"
               alt="A performer in a red and gold brocade costume and turban, speaking into a microphone">
        </button>

      </div>
    </div>
  </section>

</main>

<dialog class="lightbox" aria-label="Photo viewer">
  <button class="lightbox__btn lightbox__close" type="button" aria-label="Close photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lightbox__btn lightbox__prev" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img alt="">
  <button class="lightbox__btn lightbox__next" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</dialog>

<footer id="site-footer" class="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
